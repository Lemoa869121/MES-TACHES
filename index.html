<!DOCTYPE html>
<html lang="fr">
<head>
  <link rel="manifest" href="manifest.json">
  <script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js');
}
</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#5b5bd6">
  <meta name="description" content="Organisateur personnel privé avec tâches, projets, priorités, récurrences et sous-tâches.">
  <title>Mon organisateur</title>
  <style>
    :root {
      --primary: var(--color-primary, #5b5bd6);
      --secondary: var(--color-secondary, #ff9f43);
      --success: var(--color-success, #24a148);
      --error: var(--color-error, #da1e28);
      --warning: var(--color-warning, #f1c21b);
      --info: var(--color-info, #0f62fe);
      --bg: var(--color-neutral-100, #f5f6fa);
      --surface: #ffffff;
      --text: #202331;
      --muted: #6b7280;
      --border: var(--color-neutral-300, #dfe3eb);
      --shadow: 0 10px 30px rgba(31, 35, 48, .10);
      --radius: 18px;
    }
    * { box-sizing: border-box; }
    html { background: var(--bg); }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      background:
        radial-gradient(circle at 10% 0%, rgba(91,91,214,.14), transparent 28%),
        radial-gradient(circle at 95% 10%, rgba(255,159,67,.14), transparent 24%),
        var(--bg);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    .app { max-width: 760px; min-height: 100vh; margin: 0 auto; padding: 20px 16px 110px; }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
    .brand h1 { margin: 0; font-size: clamp(1.6rem, 7vw, 2.25rem); line-height: 1; }
    .brand p { margin: 8px 0 0; color: var(--muted); font-size: .92rem; }
    .icon-btn { border: 1px solid var(--border); background: rgba(255,255,255,.88); width: 44px; height: 44px; border-radius: 14px; box-shadow: 0 5px 16px rgba(31,35,48,.06); }
    .summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 16px; }
    .metric { background: rgba(255,255,255,.86); border: 1px solid rgba(255,255,255,.75); border-radius: 16px; padding: 12px; box-shadow: 0 5px 18px rgba(31,35,48,.06); }
    .metric strong { display: block; font-size: 1.35rem; }
    .metric span { color: var(--muted); font-size: .76rem; }
    .tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 5px; background: rgba(255,255,255,.88); border: 1px solid var(--border); border-radius: 17px; position: sticky; top: 8px; z-index: 10; backdrop-filter: blur(12px); }
    .tab { border: 0; background: transparent; padding: 11px 7px; border-radius: 12px; color: var(--muted); font-weight: 750; font-size: .88rem; }
    .tab.active { color: white; background: var(--primary); box-shadow: 0 7px 16px rgba(91,91,214,.25); }
    .toolbar { display: flex; gap: 9px; margin: 14px 0; }
    .search { flex: 1; border: 1px solid var(--border); background: rgba(255,255,255,.92); border-radius: 14px; padding: 12px 14px; min-width: 0; }
    .filter { max-width: 145px; border: 1px solid var(--border); background: rgba(255,255,255,.92); border-radius: 14px; padding: 10px; }
    .task-list { display: grid; gap: 12px; }
    .task-card { --card-color: #5b5bd6; position: relative; overflow: hidden; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 15px 14px 13px 18px; box-shadow: 0 6px 20px rgba(31,35,48,.07); }
    .task-card::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 6px; background: var(--card-color); }
    .task-card.done { opacity: .67; }
    .task-card.done .task-title { text-decoration: line-through; }
    .task-main { display: grid; grid-template-columns: auto 1fr auto; gap: 11px; align-items: start; }
    .check { appearance: none; width: 24px; height: 24px; border: 2px solid var(--card-color); border-radius: 8px; margin: 1px 0 0; display: grid; place-content: center; }
    .check:checked { background: var(--card-color); }
    .check:checked::after { content: "✓"; color: white; font-weight: 900; font-size: 15px; }
    .task-title { margin: 0 0 7px; font-size: 1rem; overflow-wrap: anywhere; }
    .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
    .pill { display: inline-flex; align-items: center; gap: 4px; border-radius: 999px; padding: 5px 8px; background: #f0f2f7; color: #51586a; font-size: .72rem; font-weight: 700; }
    .project-pill { color: var(--card-color); background: color-mix(in srgb, var(--card-color) 12%, white); }
    .priority-high { background: #ffe8ea; color: #b4232d; }
    .priority-medium { background: #fff3d7; color: #8a5a00; }
    .priority-low { background: #e8f6ed; color: #1c7038; }
    .menu-btn { border: 0; background: #f2f3f7; border-radius: 10px; width: 34px; height: 34px; color: #4b5262; }
    .subtasks { margin: 12px 0 0 35px; border-top: 1px dashed var(--border); padding-top: 10px; display: grid; gap: 8px; }
    .subtask { display: flex; gap: 8px; align-items: center; font-size: .86rem; color: #505768; }
    .subtask input { accent-color: var(--card-color); width: 17px; height: 17px; }
    .subtask.checked span { text-decoration: line-through; opacity: .65; }
    .empty { text-align: center; padding: 48px 20px; border: 2px dashed var(--border); border-radius: 20px; background: rgba(255,255,255,.55); }
    .empty .emoji { font-size: 2.5rem; }
    .empty h2 { margin-bottom: 6px; }
    .empty p { color: var(--muted); margin-top: 0; }
    .fab { position: fixed; right: max(20px, calc((100vw - 760px)/2 + 20px)); bottom: calc(22px + env(safe-area-inset-bottom)); border: 0; color: white; background: linear-gradient(135deg, var(--primary), #8d5fe8); border-radius: 18px; padding: 15px 20px; font-weight: 850; box-shadow: 0 14px 30px rgba(91,91,214,.35); z-index: 20; }
    .modal { position: fixed; inset: 0; display: none; align-items: end; justify-content: center; background: rgba(21,24,34,.55); z-index: 50; padding-top: 30px; }
    .modal.open { display: flex; }
    .sheet { width: min(760px, 100%); max-height: 94vh; overflow-y: auto; background: white; border-radius: 24px 24px 0 0; padding: 18px 18px calc(22px + env(safe-area-inset-bottom)); box-shadow: var(--shadow); }
    .sheet-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
    .sheet-head h2 { margin: 0; }
    .close { border: 0; background: #eef0f5; border-radius: 12px; width: 38px; height: 38px; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .field { display: grid; gap: 6px; }
    .field.full { grid-column: 1 / -1; }
    label { font-size: .82rem; font-weight: 780; color: #505768; }
    input, select, textarea { width: 100%; border: 1px solid var(--border); border-radius: 13px; padding: 12px; background: #fbfbfd; color: var(--text); }
    textarea { min-height: 76px; resize: vertical; }
    .color-row { display: flex; flex-wrap: wrap; gap: 9px; }
    .color-choice { appearance: none; width: 29px; height: 29px; border-radius: 50%; background: var(--c); border: 3px solid white; box-shadow: 0 0 0 1px #cfd3dc; }
    .color-choice:checked { box-shadow: 0 0 0 3px var(--c); }
    .subtask-builder { display: flex; gap: 8px; }
    .small-btn { border: 0; border-radius: 12px; background: #eceeff; color: var(--primary); font-weight: 800; padding: 0 14px; }
    .draft-subtasks { display: grid; gap: 7px; margin-top: 8px; }
    .draft-item { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 9px 11px; border-radius: 11px; background: #f5f6f9; font-size: .86rem; }
    .draft-item button { border: 0; background: transparent; color: var(--error); font-weight: 900; }
    .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 18px; }
    .primary-btn, .danger-btn, .secondary-btn { border: 0; border-radius: 14px; padding: 13px; font-weight: 850; }
    .primary-btn { background: var(--primary); color: white; }
    .secondary-btn { background: #eceef4; color: #454b5a; }
    .danger-btn { background: #ffe7e9; color: #b4232d; }
    .toast { position: fixed; left: 50%; transform: translateX(-50%) translateY(30px); bottom: 95px; z-index: 90; color: white; background: #242735; padding: 11px 16px; border-radius: 12px; box-shadow: var(--shadow); opacity: 0; pointer-events: none; transition: .25s; text-align: center; max-width: calc(100vw - 30px); }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .hidden { display: none !important; }
    @media (max-width: 520px) { .form-grid { grid-template-columns: 1fr; } .field.full { grid-column: auto; } .toolbar { flex-direction: column; } .filter { max-width: none; } }
  </style>

<body>
  <main class="app">
    <header class="topbar">
      <div class="brand">
        <h1>Mon organisateur</h1>
        <p id="todayLabel"></p>
      </div>
      <div style="display:flex;gap:8px">
        <button class="icon-btn" id="backupBtn" aria-label="Sauvegarde" title="Sauvegarde">💾</button>
        <button class="icon-btn" id="notificationBtn" aria-label="Activer les notifications" title="Notifications">🔔</button>
      </div>
    </header>

    <section class="summary" aria-label="Résumé">
      <div class="metric"><strong id="openCount">0</strong><span>à faire</span></div>
      <div class="metric"><strong id="doneCount">0</strong><span>terminées</span></div>
      <div class="metric"><strong id="progressCount">0%</strong><span>progression</span></div>
    </section>

    <nav class="tabs" aria-label="Période">
      <button class="tab active" data-view="today">Aujourd'hui</button>
      <button class="tab" data-view="tomorrow">Demain</button>
      <button class="tab" data-view="upcoming">À venir</button>
    </nav>

    <div class="toolbar">
      <input class="search" id="searchInput" type="search" placeholder="Rechercher une tâche...">
      <select class="filter" id="projectFilter" aria-label="Filtrer par projet"><option value="">Tous les projets</option></select>
    </div>

    <section id="taskList" class="task-list"></section>
  </main>

  <button class="fab" id="addTaskBtn">＋ Nouvelle tâche</button>

  <div class="modal" id="taskModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <section class="sheet">
      <header class="sheet-head">
        <h2 id="modalTitle">Nouvelle tâche</h2>
        <button class="close" id="closeModal" aria-label="Fermer">✕</button>
      </header>
      <form id="taskForm">
        <input type="hidden" id="taskId">
        <div class="form-grid">
          <div class="field full">
            <label for="title">Titre *</label>
            <input id="title" maxlength="120" required placeholder="Ex. Préparer le dossier">
          </div>
          <div class="field full">
            <label for="notes">Notes</label>
            <textarea id="notes" maxlength="600" placeholder="Informations utiles..."></textarea>
          </div>
          <div class="field">
            <label for="dueDate">Date *</label>
            <input id="dueDate" type="date" required>
          </div>
          <div class="field">
            <label for="dueTime">Heure</label>
            <input id="dueTime" type="time">
          </div>
          <div class="field">
            <label for="project">Projet ou catégorie</label>
            <input id="project" list="projectOptions" maxlength="40" placeholder="Ex. Personnel">
            <datalist id="projectOptions"></datalist>
          </div>
          <div class="field">
            <label for="priority">Priorité</label>
            <select id="priority">
              <option value="high">Haute</option>
              <option value="medium" selected>Moyenne</option>
              <option value="low">Basse</option>
            </select>
          </div>
          <div class="field">
            <label for="recurrence">Récurrence</label>
            <select id="recurrence">
              <option value="none">Aucune</option>
              <option value="daily">Tous les jours</option>
              <option value="weekly">Toutes les semaines</option>
              <option value="monthly">Tous les mois</option>
            </select>
          </div>
          <div class="field">
            <label for="reminder">Rappel</label>
            <select id="reminder">
              <option value="none">Aucun</option>
              <option value="0">À l'heure prévue</option>
              <option value="10">10 min avant</option>
              <option value="30">30 min avant</option>
              <option value="60">1 h avant</option>
              <option value="1440">1 jour avant</option>
            </select>
          </div>
          <div class="field full">
            <label>Couleur de la carte</label>
            <div class="color-row" id="colorRow"></div>
          </div>
          <div class="field full">
            <label for="subtaskInput">Sous-tâches</label>
            <div class="subtask-builder">
              <input id="subtaskInput" maxlength="100" placeholder="Ajouter une étape">
              <button class="small-btn" type="button" id="addSubtaskBtn">Ajouter</button>
            </div>
            <div class="draft-subtasks" id="draftSubtasks"></div>
          </div>
        </div>
        <div class="actions">
          <button class="danger-btn hidden" id="deleteBtn" type="button">Supprimer</button>
          <button class="primary-btn" type="submit">Enregistrer</button>
        </div>
      </form>
    </section>
  </div>

  <div class="modal" id="backupModal" role="dialog" aria-modal="true" aria-labelledby="backupTitle">
    <section class="sheet">
      <header class="sheet-head">
        <h2 id="backupTitle">Sauvegarde</h2>
        <button class="close" id="closeBackup" aria-label="Fermer">✕</button>
      </header>
      <p style="color:var(--muted);margin-top:0">Exporte tes tâches dans un fichier, ou remplace-les par celles d'un fichier exporté.</p>
      <div class="actions">
        <button class="secondary-btn" id="exportBtn" type="button">⬇ Exporter</button>
        <button class="primary-btn" id="importBtn" type="button">⬆ Importer</button>
      </div>
      <input type="file" id="importFile" accept=".json,application/json,text/plain" class="hidden">
    </section>
  </div>

  <div class="toast" id="toast" role="status"></div>

  <script>
    (() => {
      const STORAGE_KEY = 'organisateurPersonnel.tasks.v1';
      const COLORS = ['#5b5bd6','#0f8b8d','#f26b5b','#e09f3e','#7b2cbf','#2a9d58','#1976d2','#d94f8a'];
      const state = { tasks: loadTasks(), view: 'today', search: '', project: '', draftSubtasks: [] };
      const $ = id => document.getElementById(id);

      function loadTasks() {
        try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
        catch { return []; }
      }
      function saveTasks() { localStorage.setItem(STORAGE_KEY, JSON.stringify(state.tasks)); pushToWidget(); }

      // --- Application Android : envoie les 5 prochaines tâches au widget ---
      const IN_ANDROID_APP = typeof window.AndroidWidget !== 'undefined';
      function pushToWidget() {
        if (!IN_ANDROID_APP) return;
        try {
          const next = state.tasks
            .filter(t => !t.done && t.dueDate)
            .sort((a,b) => a.dueDate.localeCompare(b.dueDate) || (a.dueTime || '99:99').localeCompare(b.dueTime || '99:99') || priorityRank(a.priority) - priorityRank(b.priority))
            .slice(0, 5)
            .map(t => ({ id: t.id, title: t.title, project: t.project || '', dueDate: t.dueDate, dueTime: t.dueTime || '', priority: t.priority, color: t.color || COLORS[0] }));
          window.AndroidWidget.updateTasks(JSON.stringify({ tasks: next }));
        } catch (e) { console.warn('Widget non mis à jour', e); }
      }

      // --- Sauvegarde : export / import ---
      function exportTasks() {
        const json = JSON.stringify({ app: 'mes-taches', version: 1, exportedAt: new Date().toISOString(), tasks: state.tasks }, null, 2);
        const filename = `mes-taches-${localDateKey()}.json`;
        if (IN_ANDROID_APP && window.AndroidWidget.shareBackup) { window.AndroidWidget.shareBackup(json, filename); return; }
        const url = URL.createObjectURL(new Blob([json], { type: 'application/json' }));
        const a = document.createElement('a'); a.href = url; a.download = filename;
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 2000);
        showToast('Sauvegarde téléchargée');
      }
      function importTasks(file) {
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          try {
            const data = JSON.parse(reader.result);
            const tasks = Array.isArray(data) ? data : data.tasks;
            if (!Array.isArray(tasks) || tasks.some(t => !t || !t.id || !t.title)) throw new Error('format');
            if (!confirm(`Remplacer tes ${state.tasks.length} tâche(s) actuelle(s) par les ${tasks.length} du fichier ?`)) return;
            state.tasks = tasks.map(t => ({ subtasks: [], notes: '', project: '', priority: 'medium', recurrence: 'none', reminder: 'none', ...t }));
            saveTasks(); render(); closeBackup(); showToast(`${tasks.length} tâche(s) importée(s)`);
          } catch { showToast('Fichier invalide'); }
        };
        reader.readAsText(file);
      }
      function openBackup() { $('backupModal').classList.add('open'); }
      function closeBackup() { $('backupModal').classList.remove('open'); }

      // Bouton « retour » d'Android : ferme d'abord la fenêtre ouverte
      window.__handleBack = () => {
        if ($('taskModal').classList.contains('open')) { closeModal(); return true; }
        if ($('backupModal').classList.contains('open')) { closeBackup(); return true; }
        return false;
      };
      function uid() { return (crypto.randomUUID?.() || Date.now() + '-' + Math.random().toString(16).slice(2)); }
      function localDateKey(date = new Date()) {
        const y = date.getFullYear();
        const m = String(date.getMonth() + 1).padStart(2, '0');
        const d = String(date.getDate()).padStart(2, '0');
        return `${y}-${m}-${d}`;
      }
      function addDays(date, n) { const copy = new Date(date); copy.setDate(copy.getDate() + n); return copy; }
      function escapeHtml(value = '') { return String(value).replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])); }
      function formatDate(dateKey) {
        return new Intl.DateTimeFormat('fr-FR', { day: 'numeric', month: 'short' }).format(new Date(dateKey + 'T12:00:00'));
      }
      function labelRecurrence(value) { return ({daily:'Chaque jour',weekly:'Chaque semaine',monthly:'Chaque mois'})[value] || ''; }
      function labelPriority(value) { return ({high:'Haute',medium:'Moyenne',low:'Basse'})[value] || value; }

      function seedIfEmpty() {
        if (state.tasks.length) return;
        state.tasks = [{
          id: uid(), title: 'Découvrir mon organisateur', notes: 'Tu peux modifier ou supprimer cette tâche.',
          dueDate: localDateKey(), dueTime: '', project: 'Personnel', priority: 'medium', recurrence: 'none',
          reminder: 'none', color: COLORS[0], done: false, notified: false, createdAt: Date.now(),
          subtasks: [{id: uid(), title: 'Créer une première tâche', done: false},{id: uid(), title: 'Choisir sa priorité', done: false}]
        }];
        saveTasks();
      }

      function render() {
        renderSummary(); renderProjects(); renderTasks();
      }
      function renderSummary() {
        const open = state.tasks.filter(t => !t.done).length;
        const done = state.tasks.filter(t => t.done).length;
        const total = open + done;
        $('openCount').textContent = open;
        $('doneCount').textContent = done;
        $('progressCount').textContent = total ? Math.round(done / total * 100) + '%' : '0%';
      }
      function renderProjects() {
        const projects = [...new Set(state.tasks.map(t => t.project).filter(Boolean))].sort((a,b) => a.localeCompare(b,'fr'));
        const current = $('projectFilter').value;
        $('projectFilter').innerHTML = '<option value="">Tous les projets</option>' + projects.map(p => `<option value="${escapeHtml(p)}">${escapeHtml(p)}</option>`).join('');
        $('projectFilter').value = projects.includes(current) ? current : '';
        $('projectOptions').innerHTML = projects.map(p => `<option value="${escapeHtml(p)}"></option>`).join('');
      }
      function visibleTasks() {
        const today = localDateKey();
        const tomorrow = localDateKey(addDays(new Date(), 1));
        return state.tasks.filter(t => {
          const periodOk = state.view === 'today' ? t.dueDate <= today : state.view === 'tomorrow' ? t.dueDate === tomorrow : t.dueDate > tomorrow;
          const searchOk = !state.search || (t.title + ' ' + t.notes + ' ' + t.project).toLowerCase().includes(state.search);
          const projectOk = !state.project || t.project === state.project;
          return periodOk && searchOk && projectOk;
        }).sort((a,b) => Number(a.done) - Number(b.done) || a.dueDate.localeCompare(b.dueDate) || (a.dueTime || '99:99').localeCompare(b.dueTime || '99:99') || priorityRank(a.priority) - priorityRank(b.priority));
      }
      function priorityRank(p) { return ({high:0,medium:1,low:2})[p] ?? 3; }
      function renderTasks() {
        const tasks = visibleTasks();
        if (!tasks.length) {
          $('taskList').innerHTML = `<div class="empty"><div class="emoji">✨</div><h2>Tout est clair</h2><p>Aucune tâche dans cette vue.</p></div>`;
          return;
        }
        $('taskList').innerHTML = tasks.map(t => {
          const subDone = t.subtasks.filter(s => s.done).length;
          return `<article class="task-card ${t.done ? 'done' : ''}" style="--card-color:${escapeHtml(t.color || COLORS[0])}">
            <div class="task-main">
              <input class="check" type="checkbox" data-action="toggle" data-id="${t.id}" ${t.done ? 'checked' : ''} aria-label="Terminer la tâche">
              <div>
                <h3 class="task-title">${escapeHtml(t.title)}</h3>
                <div class="meta">
                  ${t.project ? `<span class="pill project-pill">${escapeHtml(t.project)}</span>` : ''}
                  <span class="pill">📅 ${formatDate(t.dueDate)}${t.dueTime ? ' · ' + escapeHtml(t.dueTime) : ''}</span>
                  <span class="pill priority-${t.priority}">● ${labelPriority(t.priority)}</span>
                  ${t.recurrence !== 'none' ? `<span class="pill">↻ ${labelRecurrence(t.recurrence)}</span>` : ''}
                  ${t.subtasks.length ? `<span class="pill">☑ ${subDone}/${t.subtasks.length}</span>` : ''}
                </div>
              </div>
              <button class="menu-btn" data-action="edit" data-id="${t.id}" aria-label="Modifier">✎</button>
            </div>
            ${t.subtasks.length ? `<div class="subtasks">${t.subtasks.map(s => `<label class="subtask ${s.done ? 'checked' : ''}"><input type="checkbox" data-action="subtask" data-task="${t.id}" data-subtask="${s.id}" ${s.done ? 'checked' : ''}><span>${escapeHtml(s.title)}</span></label>`).join('')}</div>` : ''}
          </article>`;
        }).join('');
      }

      function openModal(task = null) {
        $('taskForm').reset(); state.draftSubtasks = [];
        $('taskId').value = task?.id || '';
        $('modalTitle').textContent = task ? 'Modifier la tâche' : 'Nouvelle tâche';
        $('title').value = task?.title || '';
        $('notes').value = task?.notes || '';
        $('dueDate').value = task?.dueDate || (state.view === 'tomorrow' ? localDateKey(addDays(new Date(),1)) : state.view === 'upcoming' ? localDateKey(addDays(new Date(),2)) : localDateKey());
        $('dueTime').value = task?.dueTime || '';
        $('project').value = task?.project || '';
        $('priority').value = task?.priority || 'medium';
        $('recurrence').value = task?.recurrence || 'none';
        $('reminder').value = task?.reminder || 'none';
        state.draftSubtasks = (task?.subtasks || []).map(s => ({...s}));
        renderColorChoices(task?.color || COLORS[0]); renderDraftSubtasks();
        $('deleteBtn').classList.toggle('hidden', !task);
        $('taskModal').classList.add('open');
        setTimeout(() => $('title').focus(), 100);
      }
      function closeModal() { $('taskModal').classList.remove('open'); }
      function renderColorChoices(selected) {
        $('colorRow').innerHTML = COLORS.map((c,i) => `<input class="color-choice" style="--c:${c}" type="radio" name="color" value="${c}" aria-label="Couleur ${i+1}" ${c === selected ? 'checked' : ''}>`).join('');
      }
      function renderDraftSubtasks() {
        $('draftSubtasks').innerHTML = state.draftSubtasks.map((s,i) => `<div class="draft-item"><span>${escapeHtml(s.title)}</span><button type="button" data-remove-subtask="${i}">✕</button></div>`).join('');
      }
      function addDraftSubtask() {
        const title = $('subtaskInput').value.trim();
        if (!title) return;
        state.draftSubtasks.push({ id: uid(), title, done: false });
        $('subtaskInput').value = ''; renderDraftSubtasks(); $('subtaskInput').focus();
      }
      function submitTask(event) {
        event.preventDefault();
        const id = $('taskId').value;
        const existing = state.tasks.find(t => t.id === id);
        const task = {
          id: id || uid(), title: $('title').value.trim(), notes: $('notes').value.trim(), dueDate: $('dueDate').value,
          dueTime: $('dueTime').value, project: $('project').value.trim(), priority: $('priority').value,
          recurrence: $('recurrence').value, reminder: $('reminder').value,
          color: document.querySelector('input[name="color"]:checked')?.value || COLORS[0], subtasks: state.draftSubtasks,
          done: existing?.done || false, notified: false, createdAt: existing?.createdAt || Date.now()
        };
        if (!task.title || !task.dueDate) return;
        if (existing) Object.assign(existing, task); else state.tasks.push(task);
        saveTasks(); closeModal(); render(); showToast(existing ? 'Tâche mise à jour' : 'Tâche ajoutée'); checkReminders();
      }
      function toggleTask(id) {
        const task = state.tasks.find(t => t.id === id); if (!task) return;
        task.done = !task.done;
        if (task.done && task.recurrence !== 'none') createNextOccurrence(task);
        saveTasks(); render();
      }
      function createNextOccurrence(task) {
        if (state.tasks.some(t => t.parentOccurrence === task.id)) return;
        const date = new Date(task.dueDate + 'T12:00:00');
        if (task.recurrence === 'daily') date.setDate(date.getDate() + 1);
        if (task.recurrence === 'weekly') date.setDate(date.getDate() + 7);
        if (task.recurrence === 'monthly') date.setMonth(date.getMonth() + 1);
        state.tasks.push({...task, id: uid(), dueDate: localDateKey(date), done: false, notified: false, parentOccurrence: task.id, subtasks: task.subtasks.map(s => ({...s, id: uid(), done: false})), createdAt: Date.now()});
        showToast('Prochaine occurrence créée');
      }
      function toggleSubtask(taskId, subtaskId) {
        const sub = state.tasks.find(t => t.id === taskId)?.subtasks.find(s => s.id === subtaskId);
        if (sub) { sub.done = !sub.done; saveTasks(); render(); }
      }
      function deleteCurrent() {
        const id = $('taskId').value;
        if (!id || !confirm('Supprimer définitivement cette tâche ?')) return;
        state.tasks = state.tasks.filter(t => t.id !== id); saveTasks(); closeModal(); render(); showToast('Tâche supprimée');
      }
      async function requestNotifications() {
        if (!('Notification' in window)) return showToast(IN_ANDROID_APP ? 'Rappels bientôt disponibles dans l\'appli' : 'Notifications non prises en charge');
        const result = await Notification.requestPermission();
        showToast(result === 'granted' ? 'Notifications activées' : 'Notifications refusées');
        updateNotificationButton();
      }
      function updateNotificationButton() {
        $('notificationBtn').textContent = ('Notification' in window && Notification.permission === 'granted') ? '🔔' : '🔕';
      }
      function checkReminders() {
        if (!('Notification' in window) || Notification.permission !== 'granted') return;
        const now = Date.now();
        let changed = false;
        state.tasks.forEach(task => {
          if (task.done || task.notified || task.reminder === 'none' || !task.dueTime) return;
          const due = new Date(`${task.dueDate}T${task.dueTime}:00`).getTime();
          const notifyAt = due - Number(task.reminder) * 60000;
          if (now >= notifyAt && now < due + 3600000) {
            new Notification(task.title, { body: `${task.project ? task.project + ' · ' : ''}${task.dueTime}`, tag: task.id });
            task.notified = true; changed = true;
          }
        });
        if (changed) saveTasks();
      }
      function showToast(message) {
        $('toast').textContent = message; $('toast').classList.add('show');
        clearTimeout(showToast.timer); showToast.timer = setTimeout(() => $('toast').classList.remove('show'), 2200);
      }

      document.querySelectorAll('.tab').forEach(btn => btn.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(b => b.classList.remove('active')); btn.classList.add('active'); state.view = btn.dataset.view; renderTasks();
      }));
      $('addTaskBtn').addEventListener('click', () => openModal());
      $('closeModal').addEventListener('click', closeModal);
      $('taskModal').addEventListener('click', e => { if (e.target === $('taskModal')) closeModal(); });
      $('taskForm').addEventListener('submit', submitTask);
      $('deleteBtn').addEventListener('click', deleteCurrent);
      $('addSubtaskBtn').addEventListener('click', addDraftSubtask);
      $('subtaskInput').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); addDraftSubtask(); } });
      $('draftSubtasks').addEventListener('click', e => { const index = e.target.dataset.removeSubtask; if (index !== undefined) { state.draftSubtasks.splice(Number(index),1); renderDraftSubtasks(); } });
      $('taskList').addEventListener('change', e => {
        if (e.target.dataset.action === 'toggle') toggleTask(e.target.dataset.id);
        if (e.target.dataset.action === 'subtask') toggleSubtask(e.target.dataset.task, e.target.dataset.subtask);
      });
      $('taskList').addEventListener('click', e => {
        const button = e.target.closest('[data-action="edit"]');
        if (button) openModal(state.tasks.find(t => t.id === button.dataset.id));
      });
      $('searchInput').addEventListener('input', e => { state.search = e.target.value.trim().toLowerCase(); renderTasks(); });
      $('projectFilter').addEventListener('change', e => { state.project = e.target.value; renderTasks(); });
      $('notificationBtn').addEventListener('click', requestNotifications);
      $('backupBtn').addEventListener('click', openBackup);
      $('closeBackup').addEventListener('click', closeBackup);
      $('backupModal').addEventListener('click', e => { if (e.target === $('backupModal')) closeBackup(); });
      $('exportBtn').addEventListener('click', exportTasks);
      $('importBtn').addEventListener('click', () => $('importFile').click());
      $('importFile').addEventListener('change', e => { importTasks(e.target.files[0]); e.target.value = ''; });
      document.addEventListener('visibilitychange', () => { if (!document.hidden) checkReminders(); });

      $('todayLabel').textContent = new Intl.DateTimeFormat('fr-FR', { weekday:'long', day:'numeric', month:'long' }).format(new Date());
      seedIfEmpty(); renderColorChoices(COLORS[0]); render(); updateNotificationButton(); checkReminders(); setInterval(checkReminders, 30000); pushToWidget();
    })();
  </script>
</body>
</html>
